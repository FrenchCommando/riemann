name: CI

# Tests on every push and PR. On push to main, after tests pass, sends a deploy
# event to FrenchCommando/pi-deploy, whose self-hosted runner on the Pi pulls
# this repo's clone and rebuilds the container. Needs the PI_DEPLOY_TOKEN
# secret (fine-grained PAT, pi-deploy only, Contents read/write).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to pi-deploy
        env:
          GH_TOKEN: ${{ secrets.PI_DEPLOY_TOKEN }}
        run: >
          gh api repos/FrenchCommando/pi-deploy/dispatches
          -f event_type=deploy
          -f 'client_payload[app]=riemann'
          -f "client_payload[sha]=${GITHUB_SHA}"
