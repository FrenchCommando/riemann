# Edge tier: drop into your edge nginx (sites-enabled / conf.d).
# Replace riemann.example.com with your domain, then:
#   sudo certbot certonly --webroot -w /var/www/certbot -d riemann.example.com
server {
    listen 80;
    server_name riemann.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name riemann.example.com;

    ssl_certificate     /etc/letsencrypt/live/riemann.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/riemann.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Optional: gate behind Authelia like your other hosts.
    # include /etc/nginx/snippets/authelia-location.conf;
    # include /etc/nginx/snippets/authelia-authrequest.conf;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
