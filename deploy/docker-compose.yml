services:
  riemann:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: riemann:latest
    container_name: riemann
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:8088:80"   # edge nginx proxies here; never exposed publicly
