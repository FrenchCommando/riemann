# Inner tier: serves the static app. TLS terminates at the edge.
# (conf.d files are included in the http{} context, so map is allowed here.)

# App code isn't fingerprinted -> always revalidate (cheap 304s via ETag).
# Vendored KaTeX is pinned -> cache forever.
map $uri $riemann_cache {
    ~^/vendor/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The host nginx proxies here over HTTP/1.0, which nginx doesn't gzip by default.
    gzip on;
    gzip_http_version 1.0;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $riemann_cache always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    # /p/dvir serves p/dvir.html (scripts/pages.mjs).
    location / { try_files $uri $uri.html $uri/ =404; }
}
