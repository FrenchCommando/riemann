name: riemann

# Static site in a read-only nginx:alpine container, published on loopback only.
# The host nginx (deploy/edge-riemann.conf) terminates TLS for riemann.http.nyc
# and proxies here. Deployed by FrenchCommando/pi-deploy on push to main.

services:
  riemann:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: riemann:latest
    container_name: riemann
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:3020:80"
